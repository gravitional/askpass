# GitLab 13.11 shell-runner pipeline. This instance's Job Artifacts upload
# endpoint is broken, so tagged packages go directly to Generic Packages.

stages:
  - test
  - package
  - release

# 这里只放与机器无关的东西。PATH / GOCACHE / GOMODCACHE 每台 runner 都不一样,
# 放在各自 config.toml 的 [[runners]] environment 里 —— 仓库不该知道某台机器的
# 目录长什么样。job variables 会覆盖 runner environment, 所以这几项一旦写回这里,
# 换 runner 就废了 (2026-08-26 从 .15 迁到 .12 时踩的)。
#
# 原来的 GOCACHE 指在 $CI_PROJECT_DIR/.ci-cache 下, 而 shell runner 每个 job 前
# 会 git clean -ffdx —— 那份缓存其实每次都被清掉, 从来没起过作用。挪到 runner
# 配置里之后才真正跨 job 复用。
variables:
  CGO_ENABLED: "0"

default:
  tags:
    # tps-centos8-12-shell @ 10.0.255.12 (/home/ymy/gitlabrunner)。
    # 换 runner 时改这一行 + 那台机器的 config.toml, 别把路径写回上面。
    - linux-shell-12

test:
  stage: test
  script:
    - set -euo pipefail
    - go version
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...

.package_template:
  stage: package
  script:
    - set -euo pipefail
    - name="askpass-${GOOS}-${GOARCH}"
    - pkgdir="dist/${name}"
    - mkdir -p "$pkgdir"
    - ext=""; if [ "$GOOS" = windows ]; then ext=".exe"; fi
    - |
      for binary in ssh-wrapper scp-wrapper; do
        echo "Building ${name}/${binary}${ext}"
        CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
          -o "${pkgdir}/${binary}${ext}" .
      done
    - cp ssh-wrapper-config.toml "${pkgdir}/ssh-wrapper-config.example.toml"
    - cp README.md LICENSE "$pkgdir/"
    - |
      if [ "$GOOS" = windows ]; then
        (cd dist && zip -qr "${name}.zip" "$name")
      else
        tar -czf "dist/${name}.tar.gz" -C dist "$name"
      fi
    - archive=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
    - (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
    - ls -lh "$archive" "${archive}.sha256"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        package_base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/askpass/${CI_COMMIT_TAG}"
        for file in "$archive" "${archive}.sha256"; do
          curl --fail --show-error --silent --retry 3 \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --upload-file "$file" "${package_base}/$(basename "$file")"
        done
      fi
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
    - when: never

package_linux_amd64:
  extends: .package_template
  variables: { GOOS: linux, GOARCH: amd64 }

package_linux_arm64:
  extends: .package_template
  variables: { GOOS: linux, GOARCH: arm64 }

package_darwin_amd64:
  extends: .package_template
  variables: { GOOS: darwin, GOARCH: amd64 }

package_darwin_arm64:
  extends: .package_template
  variables: { GOOS: darwin, GOARCH: arm64 }

package_windows_amd64:
  extends: .package_template
  variables: { GOOS: windows, GOARCH: amd64 }

package_windows_arm64:
  extends: .package_template
  variables: { GOOS: windows, GOARCH: arm64 }

publish_release:
  stage: release
  script:
    - set -euo pipefail
    - mkdir -p dist
    - |
      package_base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/askpass/${CI_COMMIT_TAG}"
      for filename in \
        askpass-linux-amd64.tar.gz \
        askpass-linux-arm64.tar.gz \
        askpass-darwin-amd64.tar.gz \
        askpass-darwin-arm64.tar.gz \
        askpass-windows-amd64.zip \
        askpass-windows-arm64.zip; do
        curl --fail --show-error --silent --retry 3 \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --output "dist/${filename}" "${package_base}/${filename}"
      done
      (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
      curl --fail --show-error --silent --retry 3 \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/SHA256SUMS.txt "${package_base}/SHA256SUMS.txt"

      links='[]'
      for archive in dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt; do
        filename=$(basename "$archive")
        url="${package_base}/${filename}"
        links=$(printf '%s' "$links" | jq --arg name "$filename" --arg url "$url" \
          '. + [{name: $name, url: $url}]')
      done

      releases_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      encoded_tag=$(printf '%s' "$CI_COMMIT_TAG" | jq -sRr @uri)

      # CI_JOB_TOKEN may CREATE a release but not update one -- GitLab answers
      # 403 on PUT. Setting a RELEASE_TOKEN CI variable (a project or personal
      # access token with api scope) lifts that restriction; without one, a
      # re-run over an existing tag just leaves the release alone.
      if [ -n "${RELEASE_TOKEN:-}" ]; then
        auth="PRIVATE-TOKEN: ${RELEASE_TOKEN}"
      else
        auth="JOB-TOKEN: ${CI_JOB_TOKEN}"
      fi

      create_payload=$(jq -n --arg tag "$CI_COMMIT_TAG" \
        --arg name "askpass ${CI_COMMIT_TAG}" \
        --arg description "Cross-platform askpass binaries built from ${CI_COMMIT_SHA}." \
        --argjson links "$links" \
        '{tag_name: $tag, name: $name, description: $description, assets: {links: $links}}')

      status=$(curl --silent --output /tmp/release-response.json --write-out '%{http_code}' \
        --request POST --header "$auth" --header 'Content-Type: application/json' \
        --data "$create_payload" "$releases_url")

      case "$status" in
        20*)
          echo "Created release ${CI_COMMIT_TAG}."
          ;;
        409)
          # Already released once; re-running the pipeline for this tag.
          # PUT accepts only name/description -- tag_name and assets are
          # rejected there, and the asset links are keyed on the tag anyway so
          # they stay valid without being resent.
          update_payload=$(jq -n --arg name "askpass ${CI_COMMIT_TAG}" \
            --arg description "Cross-platform askpass binaries built from ${CI_COMMIT_SHA}." \
            '{name: $name, description: $description}')
          status=$(curl --silent --output /tmp/release-response.json --write-out '%{http_code}' \
            --request PUT --header "$auth" --header 'Content-Type: application/json' \
            --data "$update_payload" "${releases_url}/${encoded_tag}")
          case "$status" in
            20*)
              echo "Updated existing release ${CI_COMMIT_TAG}."
              ;;
            403)
              # Not a build failure: every package was published above, and the
              # release object already exists. Only its description is stale.
              echo "WARNING: release ${CI_COMMIT_TAG} exists and CI_JOB_TOKEN cannot update it." >&2
              echo "WARNING: packages were published; set RELEASE_TOKEN to refresh the release itself." >&2
              ;;
            *)
              echo "Updating release ${CI_COMMIT_TAG} failed with HTTP ${status}:" >&2
              cat /tmp/release-response.json >&2; echo >&2
              exit 1
              ;;
          esac
          ;;
        *)
          echo "Creating release ${CI_COMMIT_TAG} failed with HTTP ${status}:" >&2
          cat /tmp/release-response.json >&2; echo >&2
          exit 1
          ;;
      esac
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - when: never
