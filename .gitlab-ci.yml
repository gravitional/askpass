# GitLab CI for the linux-shell Runner in /data/yangmy/gitlabrunner.
# The shell executor ignores image:, so all commands use the host Go toolchain.

stages:
  - test
  - package

variables:
  CGO_ENABLED: "0"
  GOCACHE: "$CI_PROJECT_DIR/.ci-cache/go-build"
  GOMODCACHE: "/data/yangmy/gitlabrunner/cache/go-mod"

default:
  tags:
    - linux-shell

test:
  stage: test
  script:
    - set -euo pipefail
    - go version
    - test "$(go env GOVERSION | sed 's/^go//')" != ""
    - test -z "$(gofmt -l .)"
    - go vet ./...
    - go test ./...

package:
  stage: package
  script:
    - set -euo pipefail
    - go version
    - rm -rf dist
    - mkdir -p dist
    - |
      while read -r goos goarch; do
        [ -n "$goos" ] || continue
        name="askpass-${goos}-${goarch}"
        pkgdir="dist/${name}"
        mkdir -p "$pkgdir"
        ext=""
        archive_ext="tar.gz"
        if [ "$goos" = windows ]; then
          ext=".exe"
          archive_ext="zip"
        fi

        for binary in ssh-wrapper scp-wrapper; do
          echo "Building ${name}/${binary}${ext}"
          GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
            go build -trimpath -ldflags='-s -w' \
            -o "${pkgdir}/${binary}${ext}" .
        done

        cp ssh-wrapper-config.toml "${pkgdir}/ssh-wrapper-config.example.toml"
        cp README.md LICENSE "${pkgdir}/"

        if [ "$archive_ext" = zip ]; then
          (cd dist && zip -qr "${name}.zip" "$name")
        else
          tar -czf "dist/${name}.tar.gz" -C dist "$name"
        fi
      done <<'TARGETS'
      linux amd64
      linux arm64
      darwin amd64
      darwin arm64
      windows amd64
      windows arm64
      TARGETS
    - (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS.txt)
    - ls -lh dist/*
  artifacts:
    name: "askpass-${CI_COMMIT_REF_SLUG}"
    paths:
      - dist/*.tar.gz
      - dist/*.zip
      - dist/SHA256SUMS.txt
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "main"'
    - when: never
